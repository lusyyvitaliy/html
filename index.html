<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій адапртивний лендінг</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">MyPortfolio</h1> 
        <ul class="nav-links">
            <li><a href="#about">Про мене</a></li>
            <li><a href="">Всі мої навички</a></li>
            <li><a href="">Проєкти</a></li>
            <li><a href="#contacts">Контакти</a></li>  
        </ul>
    </nav>


    <header class="hero">
        <h1>Привіт, я Віталій!</h1>
        <p>Фронтенд-розробник</p>
        <button class="btn">Дізнатися більше</button>

    </header>

    <section class="about" id="about">
        <h2>Про мене</h2>
        <div class="about-container">
            <p>Я створюю стильні, адаптивні та сучасні веб-сайти.</p>
            <img src="profile.webp" alt="Моя фото">
        </div>

    </section>

    <section class="skills" id="skills"> 
        <h2>Мої навички</h2>
        <div class="skill-list">
            <div class="skill">💻 HTML</div>
            <div class="skill">🎨 CSS</div>
            <div class="skill">⚡ JavaScript</div>
            <div class="skill">🚀 React</div>
        </div>
    </section>

    <section class="projects" id="projects">
        <h2>Мої проєкти</h2>
        <div class="project-container">
            <div class="project">
                <img src="project.png" alt="Проєкт 1">
            </div>
            <div class="project">
                <img src="project_2.png" alt="Проєкт 1">
            </div>
        </div>

    </section>


    <footer class="contacts" id="contacts">
        <h2>Контакти</h2>
        <form >

            <input type="text" placeholder="Ваше ім'я" required>
            <input type="email" placeholder="email" required>
            <textarea  placeholder="Коментар"></textarea>
            <button class="btn">Відправити</button>
        </form>
    </footer>
    
</body>
</html>
